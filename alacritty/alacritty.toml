[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#000000"
blue = "#73ba9f"
cyan = "#2bcec2"
green = "#50fa7b"
magenta = "#c858e9"
red = "#ec3e45"
white = "#ffffff"
yellow = "#edbf69"

[colors.normal]
black = "#242a32"
blue = "0xbd93f9"
cyan = "#8be9fd"
green = "0x50fa7b"
magenta = "#c678dd"
red = "#d54e53"
white = "#eaeaea"
yellow = "#e5c07b"

[colors.primary]
background = "#2c323b"
foreground = "#eaeaea"

[cursor]
style = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.bold]
family = "SauceCodePro Nerd Font"
style = "Bold"

[font.bold_italic]
family = "SauceCodePro Nerd Font"
style = "Bold Italic"

[font.italic]
family = "SauceCodePro Nerd Font"
style = "Italic"

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Regular"

[mouse]
hide_when_typing = true

[window]
opacity = 0.85

[window.dimensions]
columns = 100
lines = 30
